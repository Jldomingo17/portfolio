# Servidor del portfolio estático (lo usa el Dockerfile).
# TLS y dominio los gestiona el proxy que va delante (Traefik/Caddy en Coolify).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Compresión de texto. Las imágenes y fuentes (woff2, webp) ya van comprimidas
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Assets con hash en el nombre: caché de un año e inmutable.
    # nginx no hereda los add_header del nivel superior cuando un location
    # define los suyos, por eso las cabeceras de seguridad se repiten.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # HTML y resto: siempre se revalida, así un despliegue se ve al momento
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
